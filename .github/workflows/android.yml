name: Android

# Ubuntu runners ship a JDK and the Android SDK, which is exactly what the
# machine this was written on does not have — so the APK is built here. One APK
# serves both a phone and a television: the manifest declares LAUNCHER and
# LEANBACK_LAUNCHER, and requires no touchscreen.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Nothing third-party is fetched: this runner already carries a JDK, the
      # Android SDK and Gradle, and a run was lost to GitHub answering 429 while
      # downloading actions that only set those up.
      - name: Use what the runner already has
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          $JAVA_HOME_17_X64/bin/java -version
          gradle --version | head -5

      - name: Platform and build tools
        run: yes | sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      # The UI is not copied into this tree; the build pulls renderer/ and
      # shared/ in as assets (see android/app/build.gradle, syncWebAssets).
      # Two flavours: the phone build, and the leanback one for a television.
      - name: Build both APKs
        working-directory: android
        run: gradle --no-daemon assembleMobileDebug assembleTvDebug

      - name: What came out
        run: find android/app/build/outputs/apk -name '*.apk' -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: WiSFilm-android-debug
          path: android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
